name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', 'SECURITY.md']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('crew-pr-{0}', github.event.pull_request.number) || 'million-beers-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Test production readiness gate
        run: npm run test:release
      - name: Test private integrity and operator tooling with synthetic data
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Build Worker without deploying
        run: npm run build:api
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify built app against isolated local Worker and D1
        run: npm run test:browser
      - name: Build web app
        run: npm run build:web
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_RELEASE_SHA: ${{ github.sha }}
      - name: Write public release metadata
        run: node -e 'require("node:fs").writeFileSync("apps/web/dist/release.json", JSON.stringify({commit:process.env.GITHUB_SHA}))'
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Check out reviewed candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Require compatible deployed backend
        run: node scripts/check-readiness.mjs
      - name: Configure existing Pages site
        uses: actions/configure-pages@v5
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
